services:
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.6
    container_name: elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    # Runs native binary using custom config path
    command: -Dconfig.file=/opt/elasticmq.conf

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8090:8090"
    environment:
      PORT: 8090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/order_db?sslmode=disable
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/order-pending
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/payment-processed-notification
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      elasticmq:
        condition: service_started

  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8092:8092"
    environment:
      PORT: 8092
      LOCAL_MODE: "true"
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/order-pending
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_NOTIFICATION_QUEUE_URL: http://elasticmq:9324/000000000000/payment-processed-notification
      SQS_INVENTORY_QUEUE_URL: http://elasticmq:9324/000000000000/payment-processed-inventory
      SQS_ANALYTICS_QUEUE_URL: http://elasticmq:9324/000000000000/payment-processed-analytics
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      elasticmq:
        condition: service_started

  inventory-service:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8093:8093"
    environment:
      PORT: 8093
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/order_db?sslmode=disable
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/payment-processed-inventory
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "8094:8094"
    environment:
      PORT: 8094
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/payment-processed-analytics
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      elasticmq:
        condition: service_started
