services:
  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - order-service
      - notification-service
      - payment-service
      - inventory-service
      - analytics-service

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - jaeger

  order-service:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8090:8090"
    environment:
      PORT: 8090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/order_db?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-pending
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SQS_QUEUE_URL: http://localstack:4566/000000000000/payment-processed-notification
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started

  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8092:8092"
    environment:
      PORT: 8092
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-pending
      SQS_ENDPOINT: http://localstack:4566
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:payment-processed
      SNS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started

  inventory-service:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8093:8093"
    environment:
      PORT: 8093
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/order_db?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/payment-processed-inventory
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started

  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "8094:8094"
    environment:
      PORT: 8094
      SQS_QUEUE_URL: http://localstack:4566/000000000000/payment-processed-analytics
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started

  outbox-relay:
    build:
      context: ./services/outbox-relay
      dockerfile: Dockerfile
    container_name: outbox-relay
    ports:
      - "8095:8095"
    environment:
      PORT: 8095
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/order_db?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-pending
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
