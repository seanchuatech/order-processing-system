apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seanchuatech/order-processing-system
    targetRevision: main
    path: argocd/apps/production
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
