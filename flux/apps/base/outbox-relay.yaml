apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: outbox-relay
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm-charts/app-generic
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: outbox-relay-values
      valuesKey: outbox-relay-values.yaml
