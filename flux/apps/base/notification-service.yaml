apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notification-service
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm-charts/app-generic
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: notification-service-values
      valuesKey: notification-service-values.yaml
