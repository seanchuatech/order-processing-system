apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    kubernetes:
      remoteNamespace: secrets-vault
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: secrets-vault
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
