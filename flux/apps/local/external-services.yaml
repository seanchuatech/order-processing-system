apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres
  namespace: default
subsets:
  - addresses:
      - ip: 172.20.0.2
    ports:
      - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 29092
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kafka
  namespace: default
subsets:
  - addresses:
      - ip: 172.20.0.4
    ports:
      - port: 29092
