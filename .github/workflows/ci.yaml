name: CI Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  golangci-lint:
    name: Go Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.work

      - name: Lint order-service
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: services/order

      - name: Lint notification-service
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: services/notification

      - name: Lint payment-service
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: services/payment

      - name: Lint inventory-service
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: services/inventory

      - name: Lint analytics-service
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: services/analytics

      - name: Lint outbox-relay
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: services/outbox-relay

  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.work

      - name: Run Tests (order-service)
        run: |
          cd services/order
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Tests (notification-service)
        run: |
          cd services/notification
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Tests (payment-service)
        run: |
          cd services/payment
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Tests (inventory-service)
        run: |
          cd services/inventory
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Tests (analytics-service)
        run: |
          cd services/analytics
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Tests (outbox-relay)
        run: |
          cd services/outbox-relay
          go test -v -race -coverprofile=coverage.out ./...

  helm-lint:
    name: Helm Chart Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Generic Chart
        run: helm lint helm-charts/app-generic

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate Bootstrap Module
        run: |
          cd terraform/bootstrap
          terraform init -backend=false
          terraform validate

      - name: Validate Platform Module
        run: |
          cd terraform/platform
          terraform init -backend=false
          terraform validate
