name: CI Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  golangci-lint:
    name: Go Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Lint order-service
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/order

      - name: Lint notification-service
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/notification

  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests (order-service)
        run: |
          cd services/order
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run Tests (notification-service)
        run: |
          cd services/notification
          go test -v -race -coverprofile=coverage.out ./...

  helm-lint:
    name: Helm Chart Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Generic Chart
        run: helm lint helm-charts/app-generic

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate Bootstrap Module
        run: |
          cd terraform/bootstrap
          terraform init -backend=false
          terraform validate

      - name: Validate Platform Module
        run: |
          cd terraform/platform
          terraform init -backend=false
          terraform validate
