global:
  scrape_interval: 2s

scrape_configs:
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8090']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8081']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8092']

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:8093']

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8094']
